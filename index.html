<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-2: #1f1f1f;
    --border: #2e2e2e;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #4da3ff;
    --user: #1d3a5c;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Sidebar */
  aside {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
  }
  .brand { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
  .brand span { color: var(--accent); }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    text-align: left;
  }
  .btn:hover { background: #2a2a2a; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .section-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
  #chatList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .chat-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px; font-size: 0.9rem;
    color: var(--muted); cursor: pointer;
  }
  .chat-item:hover { background: var(--panel-2); color: var(--text); }
  .chat-item.active { background: var(--panel-2); color: var(--text); }
  .chat-item .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-item .del { background: none; border: none; color: var(--muted); padding: 0 4px; visibility: hidden; }
  .chat-item:hover .del { visibility: visible; }
  .chat-item .del:hover { color: var(--danger); }
  .links a { display: block; color: var(--muted); text-decoration: none; font-size: 0.88rem; padding: 4px 2px; }
  .links a:hover { color: var(--text); }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  #menuBtn { display: none; background: none; border: none; font-size: 1.3rem; padding: 2px 6px; }
  header .spacer { flex: 1; }
  header select {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
  }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { line-height: 1.6; overflow-wrap: anywhere; }
  .msg.user {
    align-self: flex-end; background: var(--user);
    padding: 10px 14px; border-radius: 14px; max-width: 85%;
    white-space: pre-wrap;
  }
  .msg.assistant { align-self: stretch; }
  .msg.assistant p { margin: 0 0 0.7em; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.error { color: var(--danger); font-size: 0.92rem; }
  .msg pre {
    background: #111; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 0.88rem;
  }
  .msg code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msg :not(pre) > code { background: #262626; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .msg ul, .msg ol { margin: 0 0 0.7em; padding-left: 1.4em; }
  .msg h1, .msg h2, .msg h3 { margin: 0.8em 0 0.4em; line-height: 1.3; }
  .msg h1 { font-size: 1.3rem; } .msg h2 { font-size: 1.15rem; } .msg h3 { font-size: 1.05rem; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h1 { color: var(--text); font-size: 2rem; margin-bottom: 0.3em; }

  #composer { padding: 12px 16px 18px; }
  #composer form {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
  }
  #input {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    padding: 8px; max-height: 200px; line-height: 1.5;
  }
  #sendBtn {
    background: var(--accent); border: none; border-radius: 10px; color: #fff;
    padding: 8px 16px; font-weight: 600;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }

  /* Settings dialog */
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; width: min(520px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h2 { margin-top: 0; }
  dialog label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
  dialog input, dialog textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
  }
  dialog textarea { min-height: 110px; resize: vertical; }
  dialog .hint { font-size: 0.78rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  @media (max-width: 760px) {
    aside {
      position: fixed; inset: 0 auto 0 0; z-index: 10;
      transform: translateX(-100%); transition: transform 0.2s;
    }
    aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    #menuBtn { display: block; }
  }

  [hidden] { display: none !important; }
  .mic { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 1.1rem; }
  .mic.on { background: var(--danger); border-color: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,107,107,0.25); } }
  .vstatus { max-width: 780px; margin: 0 auto 8px; color: var(--accent); font-size: 0.9rem; }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">J<span>A</span>RVIS</div>
    <button class="btn primary" id="newChatBtn">+ 새 대화</button>
    <div class="section-label">대화 기록</div>
    <div id="chatList"></div>
    <button class="btn" id="settingsBtn">⚙️ 설정</button>
    <div class="links">
      <div class="section-label">자료실</div>
      <a href="porsche-911-992.html">🏎️ Porsche 911 (992)</a>
      <a href="car-parts-encyclopedia.html">🔧 자동차 부품 백과사전</a>
    </div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" aria-label="메뉴">☰</button>
      <strong id="chatTitle">Jarvis</strong>
      <div class="spacer"></div>
      <select id="modelSelect" aria-label="모델">
        <option value="claude-opus-5-5">Claude Opus 5.5</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
        <option value="claude-fable-5-1">Claude Fable 5.1</option>
      </select>
    </header>

    <div id="messages"><div class="inner" id="messagesInner"></div></div>

    <div id="composer">
      <div id="voiceStatus" class="vstatus" hidden></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Jarvis에게 메시지 보내기…"></textarea>
        <button id="micBtn" class="mic" type="button" title="음성 대화" aria-label="음성 대화">🎤</button>
        <button id="sendBtn" type="submit">보내기</button>
      </form>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>설정</h2>
      <label for="apiKey">Anthropic API 키</label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      <div class="hint">
        키는 이 브라우저의 localStorage에만 저장되고, Anthropic API(api.anthropic.com)로 직접 전송돼요.
        다른 서버로는 보내지 않아요. 키는 <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--accent)">Anthropic Console</a>에서 발급받을 수 있어요.
        공용 컴퓨터에서는 쓰지 마세요.
      </div>
      <label for="systemPrompt">Jarvis 성격 (시스템 프롬프트)</label>
      <textarea id="systemPrompt"></textarea>
      <div class="row">
        <button class="btn" value="cancel" formnovalidate>취소</button>
        <button class="btn primary" value="save" id="saveSettings">저장</button>
      </div>
    </form>
  </dialog>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm";

const DEFAULT_SYSTEM =
  "너는 사용자의 개인 AI 비서 Jarvis야. 아이언맨의 자비스처럼 침착하고 정중하며 가끔 위트 있게, 한국어로 간결하게 답해. " +
  "모르는 건 모른다고 말하고, 필요하면 되물어봐. Latency-sensitive; begin your visible answer immediately.";

// ---------- storage helpers ----------
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

let settings = store.get("jarvis.settings", { apiKey: "", system: DEFAULT_SYSTEM, model: "claude-opus-5-5" });
let chats = store.get("jarvis.chats", []);   // [{id, title, messages:[{role, content}] , updated}]
let currentId = store.get("jarvis.current", null);
let busy = false;

const $ = (id) => document.getElementById(id);
const els = {
  sidebar: $("sidebar"), chatList: $("chatList"), inner: $("messagesInner"), scroller: $("messages"),
  input: $("input"), form: $("form"), send: $("sendBtn"), model: $("modelSelect"),
  title: $("chatTitle"), dialog: $("settings"), apiKey: $("apiKey"), system: $("systemPrompt"),
};

const save = () => { store.set("jarvis.chats", chats); store.set("jarvis.current", currentId); };
const current = () => chats.find((c) => c.id === currentId) || null;

// ---------- minimal, safe markdown ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
}
function renderMarkdown(src) {
  const parts = src.split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const code = nl >= 0 ? part.slice(nl + 1) : part;
      html += `<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`;
      return;
    }
    const lines = escapeHtml(part).split("\n");
    let list = null, para = [];
    const flushPara = () => { if (para.length) { html += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
    const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map((x) => `<li>${inline(x)}</li>`).join("")}</${list.tag}>`; list = null; } };
    for (const line of lines) {
      let m;
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushPara(); flushList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
      else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); }
      else if (line.trim() === "") { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    }
    flushPara(); flushList();
  });
  return html;
}

// Text shown to the user from a stored message (content may be a string or content blocks).
function textOf(content) {
  if (typeof content === "string") return content;
  return content.filter((b) => b.type === "text").map((b) => b.text).join("");
}

// ---------- rendering ----------
function renderChatList() {
  els.chatList.innerHTML = "";
  [...chats].sort((a, b) => b.updated - a.updated).forEach((c) => {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === currentId ? " active" : "");
    const t = document.createElement("span");
    t.className = "title"; t.textContent = c.title;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "삭제";
    del.onclick = (e) => {
      e.stopPropagation();
      if (!confirm(`"${c.title}" 대화를 삭제할까요?`)) return;
      chats = chats.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = null;
      save(); renderAll();
    };
    item.append(t, del);
    item.onclick = () => { if (busy) return; currentId = c.id; save(); renderAll(); els.sidebar.classList.remove("open"); };
    els.chatList.appendChild(item);
  });
}

function addBubble(role, text, extraClass = "") {
  const div = document.createElement("div");
  div.className = `msg ${role} ${extraClass}`.trim();
  if (role === "assistant") div.innerHTML = renderMarkdown(text);
  else div.textContent = text;
  els.inner.appendChild(div);
  return div;
}

function renderMessages() {
  els.inner.innerHTML = "";
  const chat = current();
  els.title.textContent = chat ? chat.title : "Jarvis";
  if (!chat || chat.messages.length === 0) {
    els.inner.innerHTML = `<div class="empty"><h1>무엇을 도와드릴까요?</h1>
      <p>${settings.apiKey ? "아래에 메시지를 입력하세요." : "먼저 ⚙️ 설정에서 Anthropic API 키를 입력해 주세요."}</p></div>`;
    return;
  }
  for (const m of chat.messages) addBubble(m.role, textOf(m.content));
  scrollDown();
}

function renderAll() { renderChatList(); renderMessages(); }
const scrollDown = () => { els.scroller.scrollTop = els.scroller.scrollHeight; };

// ---------- API ----------
async function send(text) {
  if (!settings.apiKey) { openSettings(); return null; }

  let chat = current();
  if (!chat) {
    chat = { id: crypto.randomUUID(), title: text.slice(0, 30) || "새 대화", messages: [], updated: Date.now() };
    chats.push(chat);
    currentId = chat.id;
  }
  chat.messages.push({ role: "user", content: text });
  chat.updated = Date.now();
  save(); renderAll();

  busy = true; els.send.disabled = true;
  const bubble = addBubble("assistant", "", "cursor");
  scrollDown();

  const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
  let shown = "";
  let result = null;
  try {
    const params = {
      model: settings.model,
      max_tokens: 64000,
      system: (settings.system || DEFAULT_SYSTEM) + (voiceOn ? VOICE_NOTE : ""),
      messages: [...chat.messages],
    };
    // Server-side refusal fallback on the models that support the "default" mode.
    if (settings.model !== "claude-haiku-5-5") {
      params.betas = ["server-side-fallback-2026-07-01"];
      params.fallbacks = "default";
    }
    const stream = client.beta.messages.stream(params);
    for await (const event of stream) {
      if (event.type === "content_block_delta" && event.delta.type === "text_delta") {
        shown += event.delta.text;
        bubble.innerHTML = renderMarkdown(shown);
        scrollDown();
      }
    }
    const final = await stream.finalMessage();
    bubble.classList.remove("cursor");

    if (final.stop_reason === "refusal") {
      const why = final.stop_details?.explanation ? ` (${final.stop_details.explanation})` : "";
      bubble.remove();
      addBubble("assistant", `요청이 거절되었어요${why}. 질문을 바꿔서 다시 시도해 주세요.`, "error");
      chat.messages.pop(); // drop the refused user turn so the conversation stays valid
    } else {
      // Store full content blocks (including thinking blocks) so later turns replay them unchanged.
      chat.messages.push({ role: "assistant", content: final.content });
      result = textOf(final.content);
      if (final.stop_reason === "max_tokens") addBubble("assistant", "⚠️ 답변이 길이 제한에 걸려 잘렸어요.", "error");
    }
  } catch (err) {
    bubble.remove();
    chat.messages.pop();
    let msg = err?.message || String(err);
    if (err instanceof Anthropic.AuthenticationError) msg = "API 키가 올바르지 않아요. 설정에서 확인해 주세요.";
    else if (err instanceof Anthropic.RateLimitError) msg = "요청이 너무 많아요. 잠시 후 다시 시도해 주세요.";
    else if (err instanceof Anthropic.APIConnectionError) msg = "Anthropic API에 연결하지 못했어요. 네트워크를 확인해 주세요.";
    addBubble("assistant", `오류: ${msg}`, "error");
    els.input.value = els.input.value || text;
  } finally {
    chat.updated = Date.now();
    save(); renderChatList();
    busy = false; els.send.disabled = false;
    els.input.focus();
  }
  return result;
}

// ---------- settings ----------
function openSettings() {
  els.apiKey.value = settings.apiKey;
  els.system.value = settings.system;
  els.dialog.showModal();
}
els.dialog.addEventListener("close", () => {
  if (els.dialog.returnValue !== "save") return;
  settings.apiKey = els.apiKey.value.trim();
  settings.system = els.system.value.trim() || DEFAULT_SYSTEM;
  store.set("jarvis.settings", settings);
  renderMessages();
});

// ---------- events ----------
els.form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = els.input.value.trim();
  if (!text || busy) return;
  els.input.value = ""; autosize();
  send(text);
});
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); els.form.requestSubmit(); }
});
function autosize() { els.input.style.height = "auto"; els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px"; }
els.input.addEventListener("input", autosize);

$("newChatBtn").onclick = () => { if (busy) return; currentId = null; save(); renderAll(); els.sidebar.classList.remove("open"); els.input.focus(); };
$("settingsBtn").onclick = openSettings;
$("menuBtn").onclick = () => els.sidebar.classList.toggle("open");
els.model.value = settings.model;
els.model.onchange = () => { settings.model = els.model.value; store.set("jarvis.settings", settings); };


// ---------- voice conversation ----------
const VOICE_NOTE = "\n\n[음성 대화 중] 답변은 소리 내어 읽힌다. 마크다운, 목록, 이모지 없이 자연스러운 말로 1~3문장만 짧게 답해.";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = "speechSynthesis" in window;
let voiceOn = false, rec = null;
const micBtn = $("micBtn"), vStatus = $("voiceStatus");
function setStatus(t) { vStatus.textContent = t; vStatus.hidden = !t; }
function plain(t) {
  return t.replace(/```[\s\S]*?```/g, " 코드는 화면에 표시했어요. ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/[*_`#>]/g, "").replace(/^\s*[-•]\s+/gm, "").trim();
}
function speak(text) {
  return new Promise((resolve) => {
    if (!canSpeak) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = "ko-KR";
    const v = speechSynthesis.getVoices().find((x) => /^ko/i.test(x.lang));
    if (v) u.voice = v;
    u.rate = 1.05;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}
function stopVoice() {
  voiceOn = false;
  micBtn.classList.remove("on");
  try { rec && rec.abort(); } catch {}
  rec = null;
  if (canSpeak) speechSynthesis.cancel();
  setStatus("");
}
function listen() {
  if (!voiceOn || busy) return;
  rec = new SR();
  rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
  let finalText = "";
  rec.onstart = () => setStatus("듣고 있어요… 말씀하세요");
  rec.onresult = (e) => {
    let interim = "";
    for (const r of e.results) { if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    els.input.value = finalText + interim; autosize();
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      stopVoice();
      setStatus("마이크를 쓸 수 없어요. 브라우저의 마이크 권한을 허용했는지 확인해 주세요. 이 페이지가 마이크를 막은 환경에서 열렸을 수도 있어요.");
    } else if (e.error === "network") {
      stopVoice();
      setStatus("음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
    }
  };
  rec.onend = async () => {
    rec = null;
    if (!voiceOn) return;
    const t = finalText.trim();
    if (!t) { setTimeout(listen, 300); return; }
    els.input.value = ""; autosize();
    setStatus("생각 중…");
    const answer = await send(t);
    if (!voiceOn) return;
    if (answer) { setStatus("말하는 중… (마이크 버튼을 누르면 멈춰요)"); await speak(answer); }
    if (voiceOn) listen();
  };
  try { rec.start(); } catch { setTimeout(listen, 500); }
}
micBtn.onclick = () => {
  if (!SR) { setStatus("이 브라우저는 음성 인식을 지원하지 않아요. 데스크톱 Chrome이나 Safari에서 열어 주세요."); return; }
  if (voiceOn) { stopVoice(); return; }
  voiceOn = true; micBtn.classList.add("on");
  if (canSpeak) speechSynthesis.getVoices();
  listen();
};

renderAll();
if (!settings.apiKey) openSettings();
</script>
</body>
</html>

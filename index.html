<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Pages</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 2rem;
    font-weight: 600;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  a.card {
    display: block;
    padding: 1.2rem 2rem;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    color: #f5f5f5;
    text-decoration: none;
    font-size: 1.1rem;
    transition: background 0.2s, transform 0.2s;
  }
  a.card:hover {
    background: #262626;
    transform: translateY(-2px);
  }
  .sub {
    display: block;
    font-size: 0.85rem;
    color: #999;
    margin-top: 0.3rem;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🚗 Car Pages</h1>
    <div class="links">
      <a class="card" href="porsche-911-992.html">
        Porsche 911 (992)
        <span class="sub">인터랙티브 소개 페이지</span>
      </a>
      <a class="card" href="car-parts-encyclopedia.html">
        자동차 부품 백과사전
        <span class="sub">자동차 부품 정리 자료</span>
      </a>
    </div>
  </div>
</body>
</html>
